# =============================================================================
# 视觉百花 Sakura Gallery — 生产 nginx 配置
# -----------------------------------------------------------------------------
# 容器内路径：/etc/nginx/conf.d/default.conf
# 由 deploy/Dockerfile.frontend COPY 进 nginx:1.27-alpine 镜像（宿主机不装 nginx）。
# 结构：静态 SPA 托管 + /api 反代 FastAPI + 静态长缓存 + 按 IP 限流 + 安全头。
#
# 改完生效：docker compose -f deploy/docker-compose.prod.yml up -d --build nginx
# 语法自检：docker run --rm -v "$PWD/deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro" \
#             nginx:1.27-alpine nginx -t
# =============================================================================

# -----------------------------------------------------------------------------
# 限流 / 连接限制区
#   10m ≈ 16 万个 IP 的状态；按 IP 限流在校园 NAT 出口共享 IP 时会偏紧，
#   被 429 时按部署文档 §10 调整 rate / burst。
# -----------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_login:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_upload:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

# -----------------------------------------------------------------------------
# 匿名只读 API 微缓存（2c4g 关键优化）
#   /api/v1/photos/public 与 /api/v1/search 是无鉴权、只返回 approved 数据的读接口，
#   内容按秒级变化没有意义；这里缓 30s / 10s，把首页/探索页/重复检索的 CPU 从
#   Python 序列化上省掉。带 Authorization 的私有接口一律不进缓存（见下方 location）。
#   缓存失效语义：审核通过/下架最多延迟一个 TTL 生效，属可接受范围（文档 §11）。
# -----------------------------------------------------------------------------
proxy_cache_path /var/cache/nginx/sakura levels=1:2 keys_zone=sakura_public:32m
                 max_size=256m inactive=5m use_temp_path=off;

# 上游已有 TLS 终止（宿主机 Caddy / 云负载均衡）时，沿用它传来的协议；
# 否则用本层连接协议。不加这个 map，backend 会以为请求是 http。
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 与后端 MAX_UPLOAD_SIZE=20MB 对齐：multipart 边界/头开销留余量到 25MB。
    client_max_body_size 25m;
    client_body_timeout 60s;
    client_header_timeout 15s;

    # -------------------------------------------------------------------------
    # gzip（压缩在 CPU 与带宽间折中；图片/字体本身已压缩，不重复压）
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;
    # 可选：若构建阶段产出 .gz 预压缩文件再打开（官方 nginx 镜像已内置 gzip_static 模块）
    # gzip_static on;

    # -------------------------------------------------------------------------
    # 安全响应头
    # 注意 nginx 的 add_header 继承规则：location 里一旦出现 add_header，
    # server 级这些头就不再继承，所以下面几个带缓存头的 location 需要重复声明。
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 启用 HTTPS 后再打开 HSTS（只对 TLS 站点有意义，80 端口返回会被忽略）：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -------------------------------------------------------------------------
    # 容器内 DNS + 运行时解析上游：
    # nginx 只在启动时解析 upstream 里的主机名，backend 容器重建拿到新 IP 后会 502。
    # 用变量 proxy_pass + Docker 内置 DNS（127.0.0.11）可在运行时重新解析。
    # -------------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # 若在宿主机前置 Caddy / certbot 终止 TLS（流量先到 127.0.0.1:HTTP_PORT 再到本层），
    # 打开下面两行，让日志 / 限流拿到真实客户端 IP（只信任本机 docker 网段，防伪造）：
    # set_real_ip_from 172.16.0.0/12;
    # real_ip_header X-Forwarded-For;

    # -------------------------------------------------------------------------
    # 健康检查：给宿主机 curl / 监控 / 云厂商探活用，不经过后端
    # -------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        # 用 default_type 而不是 add_header Content-Type（后者会产生重复响应头）
        default_type "text/plain; charset=utf-8";
        return 200 "ok\n";
    }

    # -------------------------------------------------------------------------
    # 登录 / Token 接口：更严格的限流（防撞库；正常用户不受影响）
    # 注意：exact location 优先于 ^~ /api/ 前缀，所以能覆盖全局 API 限流
    # -------------------------------------------------------------------------
    location = /api/v1/auth/login {
        limit_req zone=api_login burst=10 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /api/v1/auth/token {
        limit_req zone=api_login burst=10 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # 上传接口：单独限流 + 明确的请求体上限（图片上传是 2 vCPU 上最贵的请求）
    # 后端路径为 POST /api/v1/photos/upload
    # -------------------------------------------------------------------------
    location = /api/v1/photos/upload {
        limit_req zone=api_upload burst=5 nodelay;
        limit_conn conn_per_ip 10;
        client_max_body_size 25m;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        # 上传后同步做图片处理，2 vCPU 上大图可能超过 60s，这里单独放宽
        proxy_read_timeout 120s;
    }

    # -------------------------------------------------------------------------
    # 匿名只读接口：短 TTL 微缓存（见文件头 proxy_cache_path 注释）
    # 这两个 location 比下面的 ^~ /api/ 更具体，nginx 会优先命中。
    # -------------------------------------------------------------------------
    location = /api/v1/photos/public {
        limit_req zone=api_general burst=60 nodelay;
        limit_conn conn_per_ip 50;

        proxy_cache sakura_public;
        proxy_cache_key "$scheme$host$request_method$request_uri";
        proxy_cache_valid 200 30s;
        # 带 Authorization 的请求既不读缓存也不写缓存（/search/traces 等鉴权接口防串号泄露）
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;
        # 后端短暂不可用时继续吐旧数据，比直接 502 好
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 策展专题：首页横滑卡与专题详情的读接口，匿名可缓存的只读数据。
    location ^~ /api/v1/collections {
        limit_req zone=api_general burst=60 nodelay;
        limit_conn conn_per_ip 50;

        proxy_cache sakura_public;
        proxy_cache_key "$scheme$host$request_method$request_uri";
        proxy_cache_valid 200 30s;
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location ^~ /api/v1/search {
        limit_req zone=api_general burst=60 nodelay;
        limit_conn conn_per_ip 50;

        proxy_cache sakura_public;
        proxy_cache_key "$scheme$host$request_method$request_uri";
        proxy_cache_valid 200 10s;
        # 带 Authorization 的请求既不读缓存也不写缓存（/search/traces 等鉴权接口防串号泄露）
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # 其余 API：统一反代到 backend:8000
    # ^~ 让本前缀优先于下面的静态文件正则，避免 /api/ 下的图片接口被静态缓存规则命中
    # -------------------------------------------------------------------------
    location ^~ /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_conn conn_per_ip 50;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;

        # 说明：图片（STORAGE_BACKEND=local）由后端 /api/v1/photos/{id}/image/* 输出，
        # 由后端设置 Cache-Control + ETag；此处不做 nginx proxy_cache，避免撤销/替换
        # 作品后产生脏缓存。对象存储（S3/R2）模式下图片直连对象存储域名，不经过本机。
    }

    # -------------------------------------------------------------------------
    # Vite 构建产物：文件名带 content hash，可安全永久缓存
    # -------------------------------------------------------------------------
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        access_log off;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # 自托管字体 / 品牌图 / 站点图片（frontend/public 下非 hash 资源）
    # 注意：这些文件名不含 hash，改版时请改名或加 ?v= 参数，否则浏览器会用到
    # 1 年缓存里的旧文件（见部署文档「已知限制」）。
    # -------------------------------------------------------------------------
    location ~* \.(?:avif|webp|png|jpe?g|gif|svg|ico|woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        access_log off;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # index.html：绝不缓存（否则前端发版后用户仍加载旧 asset 列表）
    # -------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # SPA 路由回退：/explore、/photo/:id、/search 等前端路由都落在 index.html
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件兜底（.git、.env 等即使误进镜像也不可访问）
    location ~ /\.(?!well-known) {
        deny all;
    }
}
